services:
  - type: web
    name: wingo-1m-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: REFRESH_SECONDS
        value: "5"
      - key: WINGO_UPSTREAM_URL
        value: "https://api-wingo1min.randorona.workers.dev/"
